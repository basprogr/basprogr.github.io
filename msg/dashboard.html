<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .btn-share {
            background-color: #28a745;
            color: #ffffff;
        }
        .btn-share:hover {
            background-color: #218838;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center; align-items: center;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 850px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Dashboard</h2>
            <button id="logoutBtn" style="background: none; border: none; color:#ff3b30; cursor: pointer; font-size:0.9rem;">Logout</button>
        </div>

        <div id="alertBox" class="alert" style="display: none; background:#e3fcef; color:#00875a; margin-bottom: 15px;"></div>

        <!-- Form Generator Room -->
        <form id="generateForm">
            <div class="form-group">
                <label>Atur Tanggal & Waktu Expired</label>
                <input type="datetime-local" id="expired_at" required>
            </div>
            <button type="submit">Buat Link Room</button>
        </form>

        <div id="generatedLinkContainer" style="display: none; margin-top: 20px; padding: 12px; background: #eef9ff; border-radius: 8px; border: 1px solid #cce5ff;">
            <label style="color:#004085; font-weight:bold;">Link Room Baru Berhasil Dibuat:</label>
            <input type="text" id="generatedLinkInput" readonly onclick="this.select()">
        </div>

        <hr style="margin-top: 24px; border: 0; border-top: 1px solid #eee;">

        <!-- Bar Pencarian & Sortir -->
        <div class="filter-bar">
            <form id="filterForm" onsubmit="event.preventDefault(); loadRooms();">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="filter-input" 
                    placeholder="Cari kode room..."
                >
                <select id="sortSelect" class="filter-select" onchange="loadRooms()">
                    <option value="created_desc">Dibuat: Terbaru</option>
                    <option value="created_asc">Dibuat: Terlama</option>
                    <option value="expired_asc">Expired: Terdekat</option>
                    <option value="expired_desc">Expired: Terjauh</option>
                </select>
                <button type="submit" class="btn-filter">Cari</button>
                <button type="button" id="btnReset" class="btn-reset" onclick="resetFilter()" style="display: none;">Reset</button>
            </form>
        </div>

        <!-- Tabel Riwayat Room Chat -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Kode Room</th>
                        <th>Dibuat Pada</th>
                        <th>Kadaluarsa Pada</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="roomsTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; color:#888; padding: 20px;">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form Edit Tanggal Expired -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Edit Tanggal Kadaluarsa</h3>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 12px;">
                Kode Room: <strong id="modal_room_code"></strong>
            </p>
            <form id="editForm">
                <input type="hidden" id="modal_room_id">
                
                <div class="form-group">
                    <label>Tanggal & Waktu Kadaluarsa Baru</label>
                    <input type="datetime-local" id="modal_expired_at" required>
                </div>

                <div class="modal-actions">
                    <button type="button" onclick="closeEditModal()" style="background:#ccc; color:#333; width:auto; padding:8px 16px;">Batal</button>
                    <button type="submit" style="width:auto; padding:8px 16px;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
